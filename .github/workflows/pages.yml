name: pages
run-name: pages
# Merging to main deploys. Any branch can be deployed by hand with "Run workflow".
on:
  push:
    branches:
      - main
  workflow_dispatch:

# What deploy-pages needs to publish, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - name: Check and build the site
        run: |
          make qa-check
          make build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  Deploy:
    needs: Build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
